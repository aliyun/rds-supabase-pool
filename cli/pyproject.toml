[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rds-supabase-poolctl"
version = "0.1.0"
description = "CLI for RDS Supabase resource portal users"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "RDS Supabase Pool contributors"}]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
poolctl = "poolctl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["poolctl*"]
